    product: IF
    exchange: CFFEX
    multiplier: 300
    tick_size: '0.2'
    margin_rate: '0.12'
    fee_per_lot: '5'
  initial_fills:
  - fill_id: A-open-1
    account_id: A
    instrument_id: SHFE.rb2610
    sequence: 1
    side: LONG
    offset: OPEN
    quantity: 3
    price: '3500'
