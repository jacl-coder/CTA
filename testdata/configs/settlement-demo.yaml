# 自主设计的两日模拟清算场景，所有价格与规则仅供演示。
server:
  host: 127.0.0.1
  port: 8003
ledger:
  database: ../../var/settlement-demo/ledger.sqlite3
  run_id: settlement-demo-20260909
  trading_day: '2026-09-09'
  queue_capacity: 256
  accounts:
  - account_id: A
    initial_capital: '100000.00'
  - account_id: B
    initial_capital: '200000.00'
  - account_id: C
    initial_capital: '1000000.00'
  instruments:
  - instrument_id: SHFE.rb2610
    product: rb
    exchange: SHFE
    multiplier: 10
    tick_size: '1'
    margin_rate: '0.10'
    fee_per_lot: '2'
  - instrument_id: DCE.i2701
    product: i
    exchange: DCE
    multiplier: 100
    tick_size: '0.5'
    margin_rate: '0.12'
    fee_per_lot: '3'
