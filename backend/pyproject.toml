[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cta-risk"
version = "0.1.0"
description = "多品种期货交易风控与清算系统"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
]

[project.scripts]
cta-risk = "cta_risk.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-pyyaml>=6,<7",
]
packaging = ["pyinstaller>=6.12,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/cta_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "strict"
markers = ["requirement(*ids): 关联需求基线中的需求编号"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cta_risk"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cta_risk"]
